<svg xmlns="http://www.w3.org/2000/svg" width="590" height="200" viewBox="0 0 590 200" role="img" aria-label="arcpy-mxd-to-aprx: Bulk-convert ArcMap .mxd documents to ArcGIS Pro .aprx projects and repair broken data sources">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2c"/>
      <stop offset="1" stop-color="#1a1a1b"/>
    </linearGradient>
    <style>
      .title { font: 600 24px 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffdb70; }
      .desc  { font: 400 17px 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #d6d6d6; }
      .pill  { font: 500 13px 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffdb70; }
      .label { font: 600 12px 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8a8a8a; letter-spacing: 2px; }
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="198" rx="18" fill="url(#bg)" stroke="#383838" stroke-width="2"/>
  <text x="32" y="40" class="label">OPEN-SOURCE TOOL</text>
  <text x="32" y="76" class="title">arcpy-mxd-to-aprx</text>
  <text x="32" y="110" class="desc">Bulk-convert ArcMap .mxd documents to ArcGIS Pro</text>
  <text x="32" y="134" class="desc">.aprx projects and repair broken data sources.</text>
  <g transform="translate(32 152)">
    <rect width="68" height="28" rx="14" fill="none" stroke="#ceb15a"/><text x="34" y="19" class="pill" text-anchor="middle">ArcPy</text>
    <rect x="78" width="126" height="28" rx="14" fill="none" stroke="#ceb15a"/><text x="141" y="19" class="pill" text-anchor="middle">ArcGIS Pro 3.x</text>
    <rect x="214" width="76" height="28" rx="14" fill="none" stroke="#ceb15a"/><text x="252" y="19" class="pill" text-anchor="middle">Python</text>
  </g>
  <text x="556" y="178" class="pill" text-anchor="end">View repo →</text>
</svg>
