<svg xmlns="http://www.w3.org/2000/svg" width="560" height="48" viewBox="0 0 560 48" role="img" aria-label="I write about these workflows and the lessons behind them on LinkedIn">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdb70"/>
      <stop offset="1" stop-color="#ceb15a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2c"/>
      <stop offset="1" stop-color="#1a1a1b"/>
    </linearGradient>
    <style>
      .txt { font: 500 17px 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#gold); }
      .in  { font: 700 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #202022; }
    </style>
  </defs>
  <rect x="1" y="1" width="558" height="46" rx="23" fill="url(#bg)" stroke="#383838" stroke-width="2"/>
  <rect x="14" y="12" width="24" height="24" rx="5" fill="url(#gold)"/>
  <text x="26" y="29.5" class="in" text-anchor="middle">in</text>
  <text x="50" y="30" class="txt">I write about these workflows and lessons on LinkedIn →</text>
</svg>
